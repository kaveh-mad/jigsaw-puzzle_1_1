<!DOCTYPE html>
<html lang="en" dir="ltr" class="web" data-mode="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="version" content="1.3">
<meta name="theme-color" content="#d9d9d9">
<meta name="mobile-web-app-capable" content="yes">
<title>Jigsaw Puzzle 1.3</title>
<style>
:root{--bg:#d9d9d9;--panel:#c9c9c9;--tray:#c2c2c2;--ink:#1d242b;--mut:#3f4850;--acc:#1558ab;--line:#9aa0a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bg);overflow:hidden}
#tray{position:absolute;left:12px;top:12px;background:var(--tray);border-radius:16px;border:2px dashed #000}
#tray.min{width:var(--cw)!important}
#board{position:absolute;background:#f7f7f7;box-shadow:0 0 0 6px #000}
#ghost,#grid{position:absolute;left:0;top:0;width:100%;height:100%}
#ghost{opacity:0;transition:opacity .3s}
.pc{position:absolute;left:0;top:0;transform-origin:center;cursor:grab;touch-action:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.android .pc{filter:none}
.pc.slide{transition:transform .3s}
.pc.mag{transition:transform .09s}
.pc.drag{will-change:transform;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.android .pc.drag{filter:none}
.pc.lock,.android .pc.lock{cursor:default;filter:none;pointer-events:none}
#panel{position:absolute;top:12px;background:var(--panel);border-radius:16px;border:2px dashed #000;padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px}
#panel.min{width:var(--cw)!important;padding:6px}
#phead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
#panel.min #phead{justify-content:center}
#panel.min #pbody,#panel.min .ttl{display:none}
.ttl{font-size:1.15rem;font-weight:700}
.ttl span{font-size:.75rem;font-weight:600;color:var(--mut);margin-left:6px}
#pbody{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;touch-action:pan-y}
#pbody h2{margin:0 0 2px;font-size:1.05rem;color:var(--acc)}
.sec{display:flex;flex-direction:column;gap:7px;padding-bottom:9px;border-bottom:1px dashed #000}
.sec.nb{border-bottom:0}
.fold{width:32px;height:32px;padding:0;border-radius:50%;background:#fff;border:1px solid #000;color:#000;display:grid;place-items:center;flex:none;cursor:pointer}
.fold svg{transition:transform .2s;pointer-events:none}
#foldL{position:absolute;left:6px;top:6px;z-index:60}
#foldL.flip svg{transform:rotate(180deg)}
#foldR svg{transform:rotate(180deg)}
#foldR.flip svg{transform:none}
button,input{font:inherit;color:inherit}
button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-weight:600}
@media (hover:hover){button:hover{background:#f3f7fd;border-color:var(--acc)}.fold:hover{background:var(--acc);border-color:var(--acc);color:#fff}}
button:active{background:#e6eefb}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc)}
input[type=text]{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;width:100%;user-select:text;-webkit-user-select:text}
.chips{display:flex;gap:6px}
.chips button{padding:6px 0;flex:1}
.tg[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.rng{display:flex;align-items:center;gap:12px}
.chkrow{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.chkrow .chk{flex:none}
select{font:inherit;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 8px;height:32px;min-width:0;flex:1;cursor:pointer;color:var(--ink)}
input[type=number]{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-weight:700;width:100%;-moz-appearance:textfield;user-select:text;-webkit-user-select:text}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.trow{display:flex;align-items:center;gap:8px}
.trow .tg{flex:1}
.spin{display:flex;align-items:center;gap:4px;flex:none}
.spin button{width:32px;height:36px;padding:0;font-size:1.2rem;line-height:1}
.spin input{width:46px;height:36px}
#timer{position:absolute;top:10px;z-index:40;transform:translateX(-50%);background:#fff;border:2px solid #000;border-radius:99px;padding:3px 20px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#timer.warn{background:#c62828;color:#fff;border-color:#7f0000}
#over{display:none;position:fixed;inset:0;z-index:150;background:rgba(200,200,200,.75);place-items:center}
#over div{background:#fff;border:2px dashed #000;border-radius:18px;padding:28px 36px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
#over h3{margin:0;font-size:2rem}
#over p{margin:0;color:var(--mut);font-weight:600}

#nv{width:64px;flex:none;font-size:1.1rem;height:36px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:99px;border:0;padding:0;background:linear-gradient(to right,var(--acc) var(--p,10%),#a9aeb4 var(--p,10%));cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{background:transparent}
#stat{margin-top:auto;color:var(--mut);font-weight:600}
#msg{color:var(--acc);min-height:1.4em;font-weight:700}
#crop{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(210,210,210,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;padding:10px;text-align:center}
#crop canvas{cursor:crosshair;box-shadow:0 4px 24px rgba(0,0,0,.3);touch-action:none}
.row{display:flex;gap:10px}
#rot{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);place-items:center;text-align:center;font-size:1.4rem;font-weight:700;padding:30px}
.portrait #rot{display:grid}
.android button{min-height:56px;font-size:17px;border-radius:12px}
.android .chips button{min-height:52px;padding:0}
.android .fold{width:44px;height:44px}
.android #foldL{left:4px;top:4px}
.android #panel.min,.android #tray.min{padding:4px}
.android .chk{min-height:44px;gap:12px;font-size:17px}
.android .chk input{width:28px;height:28px}
.android input[type=text]{min-height:52px;font-size:17px}
.android input[type=range]{height:12px}
.android input[type=range]::-webkit-slider-thumb{width:40px;height:40px}
.android #nv{width:70px;height:52px;font-size:1.2rem}
.android select{height:52px;font-size:16px}
.android .trow{flex-direction:column;align-items:stretch}
.android .spin{justify-content:space-between}
.android .spin button{width:56px;height:52px}
.android .spin input{flex:1;height:52px;font-size:1.2rem}
.android #timer{font-size:18px}
.android #pbody h2{font-size:1.15rem}
.android #stat,.android #msg{font-size:1.05rem}
</style>
</head>
<body>
<div id="stage">
  <div id="tray">
    <button class="fold" id="foldL" aria-label="Collapse pieces panel" aria-expanded="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="board"><canvas id="ghost"></canvas><canvas id="grid"></canvas></div>
  <div id="timer">02:00</div>
  <div id="panel">
    <div id="phead">
      <div class="ttl">Jigsaw Puzzle<span>v1.3</span></div>
      <button class="fold" id="foldR" aria-label="Collapse control panel" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="pbody">
      <div class="sec"><h2>1. Import image</h2>
        <input type="text" id="url" name="jp-image-address" placeholder="https://example.com/photo.jpg" aria-label="Image URL" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="url" enterkeyhint="go">
        <button id="loadUrl">Load from URL</button>
        <button id="pick">Choose file from device</button>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div class="sec"><h2>2. Crop</h2><button id="cropBtn">Crop image</button></div>
      <div class="sec"><h2>3. Shuffle</h2>
        <button id="shuf">Shuffle pieces on the left</button>
        <div class="chkrow">
          <label class="chk"><input type="checkbox" id="sfx" checked>Shuffle sound</label>
          <label class="chk"><input type="checkbox" id="sfx3" checked>Game over sound</label>
        </div>
      </div>
      <div class="sec"><h2>4. Number of pieces</h2>
        <div class="rng"><input type="range" id="n" min="2" max="100" value="12" aria-label="Number of pieces"><input type="number" id="nv" min="2" max="200" value="12" inputmode="numeric" aria-label="Exact number of pieces"></div>
        <div class="chips" id="chips"></div>
        <button id="split">Split into pieces</button>
        <div class="chkrow">
          <label class="chk"><input type="checkbox" id="sfx2" checked>Split sound</label>
          <select id="shape" aria-label="Split type">
            <option value="square" selected>Squares</option>
            <option value="jigsaw">Jigsaw</option>
            <option value="rect">Rectangles</option>
            <option value="diamond">Diamonds</option>
            <option value="cols">Vertical strips</option>
            <option value="rows">Horizontal strips</option>
          </select>
        </div>
      </div>
      <div class="sec nb"><h2>5. Help</h2>
        <button class="tg" id="guide" aria-pressed="true">Show image guide: ON</button>
        <button class="tg" id="magnet" aria-pressed="true">Magnet snap: ON</button>
        <div class="trow">
          <button class="tg" id="timerBtn" aria-pressed="true">Timer: ON</button>
          <div class="spin">
            <button id="tmDown" aria-label="Decrease minutes">&minus;</button>
            <input type="number" id="tmin" min="1" max="99" value="2" inputmode="numeric" aria-label="Timer minutes">
            <button id="tmUp" aria-label="Increase minutes">+</button>
          </div>
        </div>
      </div>
      <div id="msg" aria-live="polite"></div>
      <div id="stat"></div>
    </div>
  </div>
</div>
<div id="crop"><canvas id="cc"></canvas>
  <div class="row"><button id="cok">Apply crop</button><button id="call">Select all</button><button id="ccancel">Cancel</button></div>
  <div style="color:#333">Drag on the image to select an area. Drag the corners to resize, drag inside to move.</div>
</div>
<div id="over"><div><h3>Game over</h3><p>Time is up. Try again?</p><button id="again">Play again</button></div></div>
<div id="rot">Rotate your device to landscape to play</div>

function audio(){
 try{
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
 }catch(e){}
 return ac;
}

function load(key){
 if(bufs[key])return Promise.resolve(bufs[key]);
 if(!audio())return Promise.resolve(null);
 const bin=atob(SOUNDS[key]),bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 return new Promise(res=>{
  ac.decodeAudioData(bytes.buffer,b=>{bufs[key]=b;res(b)},()=>res(null));
 });
}

function playBuf(buf,when,rate,offset,dur,vol){
 const s=ac.createBufferSource(),g=ac.createGain();
 s.buffer=buf;s.playbackRate.value=rate;g.gain.value=vol;
 s.connect(g);g.connect(ac.destination);
 if(dur)s.start(ac.currentTime+when,offset,dur);else s.start(ac.currentTime+when);
}

function shuffleSound(){
 if(!$('sfx').checked)return;
 load('shuffle').then(buf=>{
  if(buf)[1,1.08,.95].forEach((r,i)=>playBuf(buf,i*.55,r,.18,1.95,.9));
 });
}

function splitSound(){
 if(!$('sfx2').checked)return;
 load('split').then(buf=>{if(buf)playBuf(buf,0,1,0,0,.9)});
}

function tone(type,f,t,len,vol){
 const o=ac.createOscillator(),g=ac.createGain();
 o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0,t);
 g.gain.linearRampToValueAtTime(vol,t+.02);
 g.gain.exponentialRampToValueAtTime(.0001,t+len);
 o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+len+.1);
}

function chime(big){
 if(!audio())return;
 const notes=big?[1318.5,1760,2093,2637,3136]:[1318.5,1760,2637];
 notes.forEach((f,i)=>tone('sine',f,ac.currentTime+i*(big?.12:.055),1.2,.16));
}

function gameOverSound(){
 if(!$('sfx3').checked||!audio())return;
 const t0=ac.currentTime;
 [[392,0],[349.2,.34],[311.1,.68],[261.6,1.02]].forEach(a=>{
  tone('triangle',a[0],t0+a[1],1.1,.18);
  tone('sine',a[0]/2,t0+a[1],1.1,.2);
 });
 const o=ac.createOscillator(),g=ac.createGain(),t=t0+1.4;
 o.type='sawtooth';o.frequency.setValueAtTime(196,t);o.frequency.exponentialRampToValueAtTime(82,t+1.3);
 const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+1.4);
 o.connect(f);f.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.5);
}

const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const mins=()=>Math.max(1,Math.min(99,Math.round(+$('tmin').value)||2));

function showT(){
 timerEl.textContent=fmt(Math.max(0,Math.ceil(tLeft)));
 timerEl.classList.toggle('warn',tRun&&tLeft<=10);
 timerEl.style.display=tOn?'':'none';
}
function tStop(){clearInterval(tid);tRun=false}
function tReset(){tStop();over=false;tLeft=mins()*60;$('over').style.display='none';showT()}
function tStart(){
 if(!tOn||tRun||over)return;
 tRun=true;tEnd=performance.now()+tLeft*1000;
 tid=setInterval(()=>{
  tLeft=(tEnd-performance.now())/1000;
  if(tLeft<=0){tLeft=0;gameOver()}
  showT();
 },200);
 showT();
}
function gameOver(){
 tStop();over=true;showT();
 pcs.forEach(p=>{if(p.drag){p.drag=false;p.el.classList.remove('drag','mag')}});
 gameOverSound();msg("Time's up!");$('over').style.display='grid';
}

function pickGrid(n,ar,est){
 let best=[1,n],bs=1e9;
 for(let c=1;c<=Math.min(40,n);c++)for(let r=1;r<=Math.min(40,n);r++){
  const tot=est?est(c,r):c*r,cost=Math.abs(Math.log(tot/n))*3+Math.abs(Math.log(ar*r/c));
  if(cost<bs){bs=cost;best=[c,r]}
 }
 return best;
}

function makeShape(type,n){
 const ar=iw(img)/ih(img);
 let c,r;
 if(type==='cols'){c=n;r=1}
 else if(type==='rows'){c=1;r=n}
 else if(type==='diamond'){const g=pickGrid(n,ar,(c,r)=>2*c*r+c+r);c=g[0];r=g[1]}
 else{const g=pickGrid(n,ar);c=g[0];r=g[1]}
 const sg=()=>type==='jigsaw'?(Math.random()<.5?1:-1):0;
 const h=[],v=[];
 for(let i=0;i<=r;i++){h.push([]);for(let j=0;j<c;j++)h[i].push(i>0&&i<r?sg():0)}
 for(let i=0;i<r;i++){v.push([]);for(let j=0;j<=c;j++)v[i].push(j>0&&j<c?sg():0)}
 let src={x:0,y:0,w:iw(img),h:ih(img)};
 if(type==='square'){
  const a=c/r;
  if(ar>a){src.w=ih(img)*a;src.x=(iw(img)-src.w)/2}
  else{src.h=iw(img)/a;src.y=(ih(img)-src.h)/2}
 }
 return{type:type,c:c,r:r,h:h,v:v,src:src};
}

function edgePts(P,Q,s,m){
 if(!s)return[P,P,Q,Q];
 const dx=Q[0]-P[0],dy=Q[1]-P[1],L=Math.hypot(dx,dy),d=[dx/L,dy/L],n=[-d[1],d[0]],K=1.2*m;
 const at=(u,v)=>[P[0]+d[0]*(L/2+(u-.5)*K)+n[0]*s*v*K,P[1]+d[1]*(L/2+(u-.5)*K)+n[1]*s*v*K];
 const a=at(.36,0),b=at(.64,0);
 return[P,P,a,a,at(.40,0),at(.43,.02),at(.43,.07),at(.43,.10),at(.38,.10),at(.38,.15),at(.38,.22),at(.45,.23),at(.5,.23),at(.55,.23),at(.62,.22),at(.62,.15),at(.62,.10),at(.57,.10),at(.57,.07),at(.57,.02),at(.60,0),b,b,Q,Q];
}

function addEdge(path,pts){
 for(let i=1;i<pts.length;i+=3)path.bezierCurveTo(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],pts[i+2][0],pts[i+2][1]);
}

function clipPoly(poly,W,H){
 const edges=[
  [p=>p[0]>=0,(a,b)=>[0,a[1]+(b[1]-a[1])*(0-a[0])/(b[0]-a[0])]],
  [p=>p[0]<=W,(a,b)=>[W,a[1]+(b[1]-a[1])*(W-a[0])/(b[0]-a[0])]],
  [p=>p[1]>=0,(a,b)=>[a[0]+(b[0]-a[0])*(0-a[1])/(b[1]-a[1]),0]],
  [p=>p[1]<=H,(a,b)=>[a[0]+(b[0]-a[0])*(H-a[1])/(b[1]-a[1]),H]]
 ];
 for(const e of edges){
  const out=[];
  for(let i=0;i<poly.length;i++){
   const a=poly[i],b=poly[(i+1)%poly.length],ia=e[0](a),ib=e[0](b);
   if(ia)out.push(a);
   if(ia!==ib)out.push(e[1](a,b));
  }
  poly=out;
  if(!poly.length)break;
 }
 return poly;
}

const area=p=>Math.abs(p.reduce((s,a,i)=>{const b=p[(i+1)%p.length];return s+a[0]*b[1]-b[0]*a[1]},0))/2;

function diamondPoly(p){
 const w=bw/shape.c,h=bh/shape.r,cx=(p.i+((p.j&1)?.5:0))*w,cy=p.j*h/2;
 return[[cx,cy-h/2],[cx+w/2,cy],[cx,cy+h/2],[cx-w/2,cy]];
}

function geom(p){
 const path=new Path2D();let pts=[];
 if(shape.type==='diamond'){
  const poly=clipPoly(diamondPoly(p),bw,bh);
  poly.forEach((a,i)=>i?path.lineTo(a[0],a[1]):path.moveTo(a[0],a[1]));
  path.closePath();pts=poly;
 }else{
  const cw=bw/shape.c,ch=bh/shape.r,m=Math.min(cw,ch),c=p.c,r=p.r;
  const x0=c*cw,x1=x0+cw,y0=r*ch,y1=y0+ch;
  const e=[
   edgePts([x0,y0],[x1,y0],shape.h[r][c],m),
   edgePts([x1,y0],[x1,y1],shape.v[r][c+1],m),
   edgePts([x0,y1],[x1,y1],shape.h[r+1][c],m).reverse(),
   edgePts([x0,y0],[x0,y1],shape.v[r][c],m).reverse()
  ];
  path.moveTo(x0,y0);
  e.forEach(q=>{addEdge(path,q);pts=pts.concat(q)});
  path.closePath();
 }
 let a=1e9,b=1e9,c2=-1e9,d=-1e9;
 pts.forEach(q=>{a=Math.min(a,q[0]);b=Math.min(b,q[1]);c2=Math.max(c2,q[0]);d=Math.max(d,q[1])});
 p.x0=a-M;p.y0=b-M;p.w=c2-a+M*2;p.h=d-b+M*2;p.path=path;
}

function fit(){
 const vw=document.documentElement.clientWidth||innerWidth,vh=document.documentElement.clientHeight||innerHeight;
 if(!vw||!vh)return;
 if(AND)document.body.classList.toggle('portrait',vw<vh);
 S=Math.min(vw/MINW,vh/MINH);DW=vw/S;DH=vh/S;
 RES=Math.min(S*(window.devicePixelRatio||1),RESCAP);
 stage.style.width=DW+'px';stage.style.height=DH+'px';stage.style.transform='scale('+S+')';
 tray.style.height=(DH-PAD*2)+'px';
 panel.style.left=(DW-(panelOpen?PW:CW)-PAD)+'px';panel.style.height=(DH-PAD*2)+'px';
 if(img&&shape)layout();
}

function queueFit(){
 if(fitRaf)return;
 fitRaf=requestAnimationFrame(()=>{fitRaf=0;fit()});
}

function boardDims(){
 const lw=trayOpen?TW:CW,rw=panelOpen?PW:CW;
 AXc=lw+PAD*3;AWc=DW-AXc-(rw+PAD*3);
 const AH=DH-TOP-PAD*2,sr=shape.src;
 if(shape.type==='square'){
  const cell=Math.max(4,Math.floor(Math.min(AWc/shape.c,AH/shape.r)));
  bw=cell*shape.c;bh=cell*shape.r;
 }else{
  const k=Math.min(AWc/sr.w,AH/sr.h);
  bw=Math.max(40,Math.floor(sr.w*k));bh=Math.max(40,Math.floor(sr.h*k));
 }
 bx=AXc+(AWc-bw)/2;by=TOP+(AH-bh)/2;
}

function drawPiece(p){
 const el=p.el,x=el.getContext('2d');
 el.width=Math.max(1,Math.round(p.w*RES));el.height=Math.max(1,Math.round(p.h*RES));
 el.style.width=p.w+'px';el.style.height=p.h+'px';
 x.scale(el.width/p.w,el.height/p.h);x.translate(-p.x0,-p.y0);
 x.save();x.clip(p.path);
 const ax=Math.max(0,p.x0),ay=Math.max(0,p.y0),ex=Math.min(bw,p.x0+p.w),ey=Math.min(bh,p.y0+p.h);
 if(ex>ax&&ey>ay){
  const sr=shape.src,kx=sr.w/bw,ky=sr.h/bh;
  x.drawImage(img,sr.x+ax*kx,sr.y+ay*ky,(ex-ax)*kx,(ey-ay)*ky,ax,ay,ex-ax,ey-ay);
 }
 x.strokeStyle='#fff';x.lineWidth=3;x.stroke(p.path);
 x.restore();
 x.strokeStyle='#000';x.lineWidth=1;x.stroke(p.path);
}

function drawGrid(){
 const c=$('grid'),g=c.getContext('2d');
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,c.width,c.height);
 if(shape.type!=='diamond')return;
 g.scale(c.width/bw,c.height/bh);g.lineWidth=1;
 const w=bw/shape.c,h=bh/shape.r;
 const lines=(off,color)=>{
  g.strokeStyle=color;g.beginPath();
  for(let j=-1;j<=2*shape.r+1;j++)for(let i=-1;i<=shape.c+1;i++){
   const cx=(i+((j&1)?.5:0))*w+off,cy=j*h/2+off;
   g.moveTo(cx,cy-h/2);g.lineTo(cx+w/2,cy);g.lineTo(cx,cy+h/2);g.lineTo(cx-w/2,cy);g.closePath();
  }
  g.stroke();
 };
 lines(1,'#fff');lines(0,'#000');
}

function syncVis(){
 pcs.forEach(p=>{p.el.style.display=(!trayOpen&&p.inTray&&!p.done)?'none':''});
}

function layout(){
 boardDims();
 board.style.left=bx+'px';board.style.top=by+'px';board.style.width=bw+'px';board.style.height=bh+'px';
 timerEl.style.left=(AXc+AWc/2)+'px';
 ['ghost','grid'].forEach(id=>{const c=$(id);c.width=Math.round(bw*RES);c.height=Math.round(bh*RES)});
 const gc=$('ghost'),sr=shape.src;gc.getContext('2d').drawImage(img,sr.x,sr.y,sr.w,sr.h,0,0,gc.width,gc.height);
 drawGrid();showGuide();
 pcs.forEach(p=>{
  geom(p);
  p.tx=bx+p.x0+p.w/2;p.ty=by+p.y0+p.h/2;
  drawPiece(p);
  if(p.done){p.s=1;p.x=p.tx;p.y=p.ty;put(p)}
  else if(!p.inTray){p.s=1;p.x=Math.min(DW-40,Math.max(40,p.fx*DW));p.y=Math.min(DH-40,Math.max(40,p.fy*DH));put(p)}
 });
 toTray(false,false);syncVis();
}

function setCount(n){
 const r=$('n');
 $('nv').value=n;r.value=Math.min(+r.max,n);
 r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%');
}
const clampN=v=>Math.max(2,Math.min(200,Math.round(+v)||12));
function count(){return want}

function build(n,silent){
 if(!img)return;
 shape=makeShape($('shape').value,n);
 boardDims();
 pcs.forEach(p=>p.el.remove());pcs=[];
 const add=o=>{
  const el=document.createElement('canvas');el.className='pc';
  const p=Object.assign({el:el,c:0,r:0,i:0,j:0,tx:0,ty:0,x:0,y:0,fx:0,fy:0,s:1,slot:0,done:false,drag:false,inTray:true,raf:0,nx:0,ny:0,x0:0,y0:0,w:10,h:10},o);
  drag(p);stage.appendChild(el);pcs.push(p);
 };
 if(shape.type==='diamond'){
  const full=bw/shape.c*bh/shape.r/2;
  for(let j=-1;j<=2*shape.r+1;j++)for(let i=-1;i<=shape.c+1;i++){
   const poly=clipPoly(diamondPoly({i:i,j:j}),bw,bh);
   if(poly.length>2&&area(poly)>full*.06)add({i:i,j:j});
  }
 }else{
  for(let r=0;r<shape.r;r++)for(let c=0;c<shape.c;c++)add({c:c,r:r});
 }
 tReset();layout();toTray(true,true);msg(shape.type==='square'?'Squares trim the image edges.':'');stat();setCount(pcs.length);
 if(!silent)splitSound();
}

function put(p){
 p.el.style.transform='translate('+(p.x-p.w/2)+'px,'+(p.y-p.h/2)+'px) scale('+p.s+')';
}

function toTray(shuf,all){
 if(all)pcs.forEach(p=>{if(!p.done)p.inTray=true});
 const list=pcs.filter(p=>!p.done&&p.inTray).sort((a,b)=>a.slot-b.slot),n=list.length;
 if(!n)return;
 if(shuf)for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
 let mw=1,mh=1;
 list.forEach(p=>{mw=Math.max(mw,p.w);mh=Math.max(mh,p.h)});
 const uw=TW-PAD*2,uh=DH-PAD*4-HD;
 let best={ts:0,c:1};
 for(let c=1;c<=Math.min(MAXCOLS,n);c++){
  const ts=Math.min(1,(uw/c-6)/mw,(uh/Math.ceil(n/c)-6)/mh);
  if(ts>best.ts)best={ts:ts,c:c};
 }
 const rws=Math.ceil(n/best.c),cw=uw/best.c,ch=Math.min(uh/rws,mh*best.ts+8);
 list.forEach((p,i)=>{
  p.slot=i;p.s=best.ts;
  p.x=PAD*2+(i%best.c+.5)*cw;p.y=PAD*2+HD+(Math.floor(i/best.c)+.5)*ch;
  p.el.classList.add('slide');p.el.style.zIndex=10;put(p);
  setTimeout(()=>p.el.classList.remove('slide'),350);
 });
}

function showGuide(){$('ghost').style.opacity=guide?.22:0}
function stat(){$('stat').textContent=pcs.filter(p=>p.done).length+' of '+pcs.length+' pieces placed'}

function drag(p){
 const el=p.el;let ox=0,oy=0;
 const pt=e=>{const r=stage.getBoundingClientRect();return[(e.clientX-r.left)/S,(e.clientY-r.top)/S]};
 const apply=()=>{
  p.raf=0;
  if(!p.drag)return;
  const near=magnet&&Math.hypot(p.nx-p.tx,p.ny-p.ty)<MR;
  el.classList.toggle('mag',near);
  p.x=near?p.tx:p.nx;p.y=near?p.ty:p.ny;put(p);
 };
 el.addEventListener('pointerdown',e=>{
  if(p.done||p.drag||over)return;
  e.preventDefault();audio();tStart();
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  const q=pt(e);ox=(q[0]-p.x)/p.s;oy=(q[1]-p.y)/p.s;
  p.s=1;p.drag=true;p.inTray=false;el.style.zIndex=++z;
  el.classList.remove('slide','mag');el.classList.add('drag');
  p.nx=q[0]-ox;p.ny=q[1]-oy-LIFT;p.x=p.nx;p.y=p.ny;put(p);
 });
 el.addEventListener('pointermove',e=>{
  if(!p.drag)return;
  const q=pt(e);p.nx=q[0]-ox;p.ny=q[1]-oy-LIFT;
  if(!p.raf)p.raf=requestAnimationFrame(apply);
 });
 const up=()=>{
  if(!p.drag)return;
  p.drag=false;
  if(p.raf){cancelAnimationFrame(p.raf);p.raf=0}
  el.classList.remove('mag','drag');
  if(Math.hypot(p.nx-p.tx,p.ny-p.ty)<(magnet?MR:TOL)){
   p.x=p.tx;p.y=p.ty;p.done=true;put(p);
   el.classList.add('lock');el.style.zIndex=2;chime(false);stat();
   if(pcs.every(q=>q.done)){tStop();setTimeout(()=>chime(true),250);msg('Well done! Puzzle complete.')}
  }else if(trayOpen&&p.nx<TW+PAD*2){
   p.inTray=true;p.slot=1e9;toTray(false,false);
  }else{
   p.x=p.nx;p.y=p.ny;p.fx=p.x/DW;p.fy=p.y/DH;put(p);
  }
 };
 el.addEventListener('pointerup',up);
 el.addEventListener('pointercancel',up);
}

function setImg(i){img=i;build(count())}

function loadSrc(src,isUrl){
 let s=src.trim();
 if(isUrl&&!/^(https?:|data:|blob:)/i.test(s))s='https://'+s.replace(/^\/+/,'');
 const i=new Image();
 i.referrerPolicy='no-referrer';
 i.onload=()=>{setImg(i);msg('Image loaded.')};
 i.onerror=()=>msg(isUrl?'Could not load this link. It must be a direct link to an image file. You can also choose a file, drop one here, or paste an image.':'Could not read this file.');
 i.src=s;
}

$('loadUrl').onclick=()=>{const u=$('url').value.trim();if(u)loadSrc(u,true)};
$('url').onkeydown=e=>{if(e.key==='Enter')$('loadUrl').click()};
$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(f)loadSrc(URL.createObjectURL(f),false);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{
 e.preventDefault();
 const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));
 if(f){loadSrc(URL.createObjectURL(f),false);return}
 const u=(e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain')).split('\n')[0];
 if(u)loadSrc(u,true);
});
addEventListener('paste',e=>{
 if(e.target&&e.target.id==='url')return;
 const it=[...(e.clipboardData?e.clipboardData.items:[])].find(x=>x.type.startsWith('image/'));
 if(it)loadSrc(URL.createObjectURL(it.getAsFile()),false);
});
$('shuf').onclick=()=>{audio();if(over)return;toTray(true,true);syncVis();shuffleSound()};
$('split').onclick=()=>{audio();build(count())};
$('again').onclick=()=>{audio();build(count())};
$('shape').onchange=()=>{audio();build(count())};
$('n').addEventListener('input',()=>{$('nv').value=$('n').value;$('n').style.setProperty('--p',(($('n').value-$('n').min)/($('n').max-$('n').min)*100)+'%')});
$('n').addEventListener('change',()=>{audio();want=clampN($('n').value);build(want)});
$('nv').addEventListener('change',()=>{audio();want=clampN($('nv').value);setCount(want);build(want)});
$('nv').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});
[6,12,20,30,48].forEach(n=>{
 const b=document.createElement('button');b.textContent=n;
 b.onclick=()=>{audio();want=n;setCount(n);build(n)};$('chips').appendChild(b);
});
$('guide').onclick=e=>{
 guide=!guide;e.currentTarget.setAttribute('aria-pressed',guide);
 e.currentTarget.textContent='Show image guide: '+(guide?'ON':'OFF');showGuide();
};
$('magnet').onclick=e=>{
 magnet=!magnet;e.currentTarget.setAttribute('aria-pressed',magnet);
 e.currentTarget.textContent='Magnet snap: '+(magnet?'ON':'OFF');
};
$('timerBtn').onclick=e=>{
 tOn=!tOn;e.currentTarget.setAttribute('aria-pressed',tOn);
 e.currentTarget.textContent='Timer: '+(tOn?'ON':'OFF');
 if(!tOn){tStop();showT()}
 else if(!over&&!tRun&&!pcs.every(p=>p.done)){tLeft=mins()*60;showT()}
 else showT();
};
const setMins=v=>{
 $('tmin').value=Math.max(1,Math.min(99,Math.round(v)||2));
 if(!tRun&&!over){tLeft=mins()*60;showT()}
};
$('tmDown').onclick=()=>setMins(mins()-1);
$('tmUp').onclick=()=>setMins(mins()+1);
$('tmin').addEventListener('change',()=>setMins(+$('tmin').value));
function fold(btn,box,open,labelOpen,labelClosed){
 box.classList.toggle('min',!open);
 btn.classList.toggle('flip',!open);
 btn.setAttribute('aria-expanded',open);
 btn.setAttribute('aria-label',open?labelOpen:labelClosed);
}
$('foldL').onclick=()=>{trayOpen=!trayOpen;fold($('foldL'),tray,trayOpen,'Collapse pieces panel','Expand pieces panel');fit()};
$('foldR').onclick=()=>{panelOpen=!panelOpen;fold($('foldR'),panel,panelOpen,'Collapse control panel','Expand control panel');fit()};

const cm=$('crop'),cc=$('cc'),cx=cc.getContext('2d'),HIT=AND?30:16,HS=AND?14:6;
let k,R,mode,st;
$('cropBtn').onclick=()=>{
 const vw=document.documentElement.clientWidth||innerWidth,vh=document.documentElement.clientHeight||innerHeight;
 k=Math.min(vw*.9/iw(img),vh*(AND?.62:.7)/ih(img));
 cc.width=Math.round(iw(img)*k);cc.height=Math.round(ih(img)*k);
 R={x:0,y:0,w:cc.width,h:cc.height};cm.style.display='flex';drawC();
};
function drawC(){
 cx.clearRect(0,0,cc.width,cc.height);
 cx.drawImage(img,0,0,cc.width,cc.height);
 cx.fillStyle='rgba(255,255,255,.65)';
 cx.fillRect(0,0,cc.width,R.y);cx.fillRect(0,R.y+R.h,cc.width,cc.height);
 cx.fillRect(0,R.y,R.x,R.h);cx.fillRect(R.x+R.w,R.y,cc.width,R.h);
 cx.strokeStyle='#1558ab';cx.lineWidth=2;cx.strokeRect(R.x,R.y,R.w,R.h);
 cx.fillStyle='#1558ab';
 [[R.x,R.y],[R.x+R.w,R.y],[R.x,R.y+R.h],[R.x+R.w,R.y+R.h]].forEach(a=>cx.fillRect(a[0]-HS,a[1]-HS,HS*2,HS*2));
}
function cpos(e){
 const r=cc.getBoundingClientRect();
 return{x:(e.clientX-r.left)*cc.width/r.width,y:(e.clientY-r.top)*cc.height/r.height};
}
const cX=v=>Math.max(0,Math.min(cc.width,v)),cY=v=>Math.max(0,Math.min(cc.height,v));
cc.onpointerdown=e=>{
 cc.setPointerCapture(e.pointerId);
 const p=cpos(e);st=p;
 const cs=[[R.x,R.y,'tl'],[R.x+R.w,R.y,'tr'],[R.x,R.y+R.h,'bl'],[R.x+R.w,R.y+R.h,'br']].find(c=>Math.hypot(c[0]-p.x,c[1]-p.y)<HIT);
 if(cs){mode=cs[2];st={a:R.x+(mode[1]==='l'?R.w:0),b:R.y+(mode[0]==='t'?R.h:0)}}
 else if(p.x>R.x&&p.x<R.x+R.w&&p.y>R.y&&p.y<R.y+R.h){mode='mv';st={dx:p.x-R.x,dy:p.y-R.y}}
 else mode='new';
};
cc.onpointermove=e=>{
 if(!mode)return;
 const p=cpos(e),x=cX(p.x),y=cY(p.y);
 if(mode==='new')R={x:Math.min(st.x,x),y:Math.min(st.y,y),w:Math.abs(x-st.x),h:Math.abs(y-st.y)};
 else if(mode==='mv'){R.x=Math.max(0,Math.min(cc.width-R.w,p.x-st.dx));R.y=Math.max(0,Math.min(cc.height-R.h,p.y-st.dy))}
 else R={x:Math.min(st.a,x),y:Math.min(st.b,y),w:Math.abs(x-st.a),h:Math.abs(y-st.b)};
 drawC();
};
cc.onpointerup=()=>{mode=null};
$('cok').onclick=()=>{
 if(R.w<20||R.h<20)return;
 const c=document.createElement('canvas');
 c.width=Math.round(R.w/k);c.height=Math.round(R.h/k);
 c.getContext('2d').drawImage(img,R.x/k,R.y/k,R.w/k,R.h/k,0,0,c.width,c.height);
 cm.style.display='none';setImg(c);
};
$('call').onclick=()=>{R={x:0,y:0,w:cc.width,h:cc.height};drawC()};
$('ccancel').onclick=()=>{cm.style.display='none'};

setCount(12);showT();
if(AND)fold($('foldR'),panel,false,'Collapse control panel','Expand control panel');
addEventListener('resize',queueFit);
const first=new Image();
first.onload=()=>{img=first;fit();build(12,true);setTimeout(fit,150)};
first.src=DEFAULT_IMG;
})();
</script>
